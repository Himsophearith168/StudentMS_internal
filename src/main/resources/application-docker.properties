# Spring Boot – Docker profile
# This profile is activated when running inside the Docker container.
# All sensitive values are injected via environment variables (set in docker-compose.yml).

spring.application.name=studentMS_InternalAdmin

# DataSource — host "db" resolves to the MySQL container on the Docker network
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS}
